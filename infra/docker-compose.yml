services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: khronist
      POSTGRES_PASSWORD: khronist
      POSTGRES_DB: khronist
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata:
